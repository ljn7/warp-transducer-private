name: CUDA build matrix

# Compile-only verification that the CUDA code builds against many CUDA
# toolkit versions. No GPU is required: these jobs install the CUDA toolkit
# and compile with WITH_GPU=ON but do not run test_gpu (GitHub-hosted runners
# have no GPU).
#
# Coverage: latest patch of each CUDA minor, 11.8 through 13.2, on both
# platforms.
#   Linux:   built inside the official nvidia/cuda:<ver>-devel-ubuntu22.04
#            Docker images.
#   Windows: installed with the Jimver/cuda-toolkit action and built with the
#            runner's default MSVC toolset. For CUDA < 12.4 the build defines
#            _ALLOW_COMPILER_AND_STL_VERSION_MISMATCH (via
#            CUDA_ALLOW_UNSUPPORTED_COMPILER) to get past the toolset-14.40+
#            STL1002 assert; the hosted runner has no older toolset to pin to.
#
# CUDA 13.x builds use CMakeLists' version-aware architecture list, which drops
# the Maxwell/Pascal/Volta targets that CUDA 13 removed.
#
# WARNING ON COST: this matrix installs a multi-GB toolkit per job (13 Linux +
# 13 Windows), and Windows runners bill at 2x. It is wired to run on every
# branch push and pull request; narrow the branches filter or trim the matrix
# if Actions minutes become a concern.

on:
  workflow_dispatch:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']

jobs:
  # ===========================================================================
  # LINUX: build inside NVIDIA CUDA "devel" images (nvcc + curand preinstalled)
  # ===========================================================================
  linux-cuda-build:
    name: Linux CUDA ${{ matrix.version }} (compile-only)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:${{ matrix.version }}-devel-ubuntu22.04
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        version:
          - "11.8.0"
          - "12.0.1"
          - "12.1.1"
          - "12.2.2"
          - "12.3.2"
          - "12.4.1"
          - "12.5.1"
          - "12.6.3"
          - "12.8.1"
          - "12.9.1"
          - "13.0.2"
          - "13.1.1"
          - "13.2.0"

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y cmake ninja-build build-essential git

      - name: Configure (GPU)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_GPU=ON

      - name: Build (compiles CUDA; no GPU required)
        run: cmake --build build --parallel

  # ===========================================================================
  # WINDOWS: install the CUDA toolkit with Jimver, set up MSVC, compile
  #
  # The full 11.8 - 13.2 range is attempted. Two combinations need workarounds
  # on the hosted windows-latest runner (which ships a recent MSVC):
  #   * CUDA < 12.4: the runner's MSVC standard library hard-asserts
  #     (STL1002 "expected CUDA 12.4 or newer"). CUDA_ALLOW_UNSUPPORTED_COMPILER
  #     defines _ALLOW_COMPILER_AND_STL_VERSION_MISMATCH to silence it. Very old
  #     toolkits may still fail on newer STL headers; CI reports which.
  #   * CUDA 13.x: the network installer omits the crt headers
  #     (crt/host_config.h missing), so those versions use method: local, whose
  #     full installer lays down the complete header tree.
  # Linux covers the same range via the CUDA devel containers.
  # ===========================================================================
  windows-cuda-build:
    name: Windows CUDA ${{ matrix.version }} (compile-only)
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - "11.8.0"
          - "12.0.1"
          - "12.1.1"
          - "12.2.2"
          - "12.3.2"
          - "12.4.1"
          - "12.5.1"
          - "12.6.3"
          - "12.8.1"
          - "12.9.1"
          - "13.0.2"
          - "13.1.1"
          - "13.2.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CUDA <= 12.x: a curated sub-package set is enough and keeps the install
      # small. curand_dev provides curand.lib (the import library FindCUDA
      # resolves CUDA_curand_LIBRARY against); the plain curand component only
      # ships the runtime DLL.
      - name: Install CUDA toolkit ${{ matrix.version }} (curated)
        if: ${{ !startsWith(matrix.version, '13.') }}
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.version }}
          method: network
          sub-packages: '["nvcc", "cudart", "curand", "curand_dev", "thrust", "visual_studio_integration"]'

      # CUDA 13.x: the curated sub-packages omit the crt headers
      # (crt/host_config.h), so install the full toolkit instead.
      - name: Install CUDA toolkit ${{ matrix.version }} (full)
        if: ${{ startsWith(matrix.version, '13.') }}
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.version }}
          method: network

      - name: Set up MSVC environment
        # The Ninja generator does not auto-load vcvars the way the Visual
        # Studio generator does, so cl.exe must be put on PATH explicitly.
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add Ninja to PATH
        run: |
          $ninja = Get-ChildItem -Recurse "C:\Program Files\Microsoft Visual Studio" -Filter ninja.exe 2>$null | Select-Object -First 1
          if ($ninja) {
            echo $ninja.DirectoryName | Out-File -Append -FilePath $env:GITHUB_PATH
          }

      - name: Configure (GPU)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_GPU=ON
          -DCUDA_ALLOW_UNSUPPORTED_COMPILER=ON

      - name: Build (compiles CUDA; no GPU required)
        run: cmake --build build
