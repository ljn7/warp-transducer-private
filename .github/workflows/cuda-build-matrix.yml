name: CUDA build matrix

# Compile-only verification that the CUDA code builds against many CUDA
# toolkit versions. No GPU is required: these jobs install the CUDA toolkit
# and compile with WITH_GPU=ON but do not run test_gpu (GitHub-hosted runners
# have no GPU).
#
# Coverage: latest patch of each CUDA minor from 11.8 through 13.2.
#   Linux:   built inside the official nvidia/cuda:<ver>-devel-ubuntu22.04
#            Docker images (nvcc + libraries preinstalled).
#   Windows: the CUDA toolkit is installed with the Jimver/cuda-toolkit
#            action, then compiled with the Ninja generator.
#
# CUDA 13.x builds use CMakeLists' version-aware architecture list, which drops
# the Maxwell/Pascal/Volta targets that CUDA 13 removed.
#
# WARNING ON COST: this matrix is large (13 Linux + 13 Windows jobs) and each
# job installs a multi-GB toolkit. Windows runners bill at 2x. It is wired to
# run on every branch push and pull request; narrow the branches filter or
# trim the matrix if Actions minutes become a concern.

on:
  workflow_dispatch:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']

jobs:
  # ===========================================================================
  # LINUX: build inside NVIDIA CUDA "devel" images (nvcc + curand preinstalled)
  # ===========================================================================
  linux-cuda-build:
    name: Linux CUDA ${{ matrix.version }} (compile-only)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:${{ matrix.version }}-devel-ubuntu22.04
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        version:
          - "11.8.0"
          - "12.0.1"
          - "12.1.1"
          - "12.2.2"
          - "12.3.2"
          - "12.4.1"
          - "12.5.1"
          - "12.6.3"
          - "12.8.1"
          - "12.9.1"
          - "13.0.2"
          - "13.1.1"
          - "13.2.0"

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y cmake ninja-build build-essential git

      - name: Configure (GPU)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_GPU=ON

      - name: Build (compiles CUDA; no GPU required)
        run: cmake --build build --parallel

  # ===========================================================================
  # WINDOWS: install the CUDA toolkit with Jimver, set up MSVC, compile
  #
  # CUDA_ALLOW_UNSUPPORTED_COMPILER=ON lets older toolkits (11.8, 12.0, 12.1)
  # compile against the newer VS 2022 toolset on windows-latest.
  # ===========================================================================
  windows-cuda-build:
    name: Windows CUDA ${{ matrix.version }} (compile-only)
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - "11.8.0"
          - "12.0.1"
          - "12.1.1"
          - "12.2.2"
          - "12.3.2"
          - "12.4.1"
          - "12.5.1"
          - "12.6.3"
          - "12.8.1"
          - "12.9.1"
          - "13.0.2"
          - "13.1.1"
          - "13.2.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CUDA toolkit ${{ matrix.version }}
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.version }}
          method: network
          # curand_dev provides curand.lib (the import library the linker
          # needs); the plain curand component only ships the runtime DLL.
          # FindCUDA resolves CUDA_curand_LIBRARY against that .lib.
          sub-packages: '["nvcc", "cudart", "curand", "curand_dev", "thrust", "visual_studio_integration"]'

      - name: Set up MSVC environment
        # The Ninja generator does not auto-load vcvars the way the Visual
        # Studio generator does, so cl.exe must be put on PATH explicitly.
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add Ninja to PATH
        run: |
          $ninja = Get-ChildItem -Recurse "C:\Program Files\Microsoft Visual Studio" -Filter ninja.exe 2>$null | Select-Object -First 1
          if ($ninja) {
            echo $ninja.DirectoryName | Out-File -Append -FilePath $env:GITHUB_PATH
          }

      - name: Configure (GPU)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_GPU=ON
          -DCUDA_ALLOW_UNSUPPORTED_COMPILER=ON

      - name: Build (compiles CUDA; no GPU required)
        run: cmake --build build
