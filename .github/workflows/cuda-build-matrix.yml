name: CUDA build matrix

# Compile-only verification that the CUDA code builds against multiple CUDA
# toolkit versions, mirroring the versions we ship wheels for. No GPU is
# required: these jobs install the CUDA toolkit and compile with WITH_GPU=ON
# but do not run test_gpu (GitHub-hosted runners have no GPU).
#
# This is the expensive matrix (each job installs a multi-GB toolkit), so it
# runs on pull requests to master, pushes to master, and manual dispatch,
# rather than on every push to every branch. To run it on a feature branch,
# either open a pull request or trigger it manually from the Actions tab.
#
# CUDA coverage mirrors build_wheels.yml:
#   Linux:   cu118, cu121, cu124, cu126
#   Windows: cu121, cu124, cu126   (cu118 excluded: CUDA 11.8 rejects the
#                                    newer MSVC on windows-latest)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  # ===========================================================================
  # LINUX: build inside NVIDIA CUDA "devel" images (ship nvcc + curand)
  # ===========================================================================
  linux-cuda-build:
    name: Linux ${{ matrix.cuda }} (compile-only)
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: "cu118"
            image: "nvidia/cuda:11.8.0-devel-ubuntu22.04"
          - cuda: "cu121"
            image: "nvidia/cuda:12.1.0-devel-ubuntu22.04"
          - cuda: "cu124"
            image: "nvidia/cuda:12.4.1-devel-ubuntu22.04"
          - cuda: "cu126"
            image: "nvidia/cuda:12.6.0-devel-ubuntu22.04"

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y cmake ninja-build build-essential git

      - name: Configure (GPU)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_GPU=ON

      - name: Build (compiles CUDA; no GPU required)
        run: cmake --build build --parallel

  # ===========================================================================
  # WINDOWS: install the CUDA toolkit, set up MSVC, compile with Ninja
  # ===========================================================================
  windows-cuda-build:
    name: Windows ${{ matrix.cuda }} (compile-only)
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: "cu121"
            cuda_version: "12.1.0"
          - cuda: "cu124"
            cuda_version: "12.4.0"
          - cuda: "cu126"
            cuda_version: "12.6.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CUDA toolkit ${{ matrix.cuda_version }}
        uses: Jimver/cuda-toolkit@v0.2.15
        with:
          cuda: ${{ matrix.cuda_version }}
          method: network
          sub-packages: '["nvcc", "cudart", "curand", "cublas", "thrust", "visual_studio_integration"]'

      - name: Set up MSVC environment
        # The Ninja generator does not auto-load vcvars the way the Visual
        # Studio generator does, so cl.exe must be put on PATH explicitly.
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add Ninja to PATH
        run: |
          $ninja = Get-ChildItem -Recurse "C:\Program Files\Microsoft Visual Studio" -Filter ninja.exe 2>$null | Select-Object -First 1
          if ($ninja) {
            echo $ninja.DirectoryName | Out-File -Append -FilePath $env:GITHUB_PATH
          }

      - name: Configure (GPU)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_GPU=ON

      - name: Build (compiles CUDA; no GPU required)
        run: cmake --build build
